<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice Shop · Login form demonstration</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><span class="brand-mark" aria-hidden="true">J</span><span>Juice Shop <small>Login form demonstration</small></span></header>
  <main>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Login</h1>
      <p class="intro">Enter your email and password to sign in.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" aria-describedby="email-error">
        <p class="field-error" id="email-error"></p>
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="password-help password-error">
          <button id="toggle-password" class="secondary" type="button" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p class="help" id="password-help">At least 8 characters; at most 72 bytes.</p>
        <p class="field-error" id="password-error"></p>
        <button id="login-button" class="primary" type="submit">Log in</button>
        <div id="feedback" role="status" aria-live="polite" aria-atomic="true">
          <p id="status">Ready to log in.</p>
          <p id="submitted-email"></p>
        </div>
      </form>
      <aside aria-label="Demonstration account">
        <strong>Try the demo account</strong>
        <p>Email: <code>student@example.com</code><br>Password: <code>Student123!</code></p>
        <small>Use these sample credentials for this local exercise.</small>
      </aside>
    </section>
  </main>
</body>
</html>
